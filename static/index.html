<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastCity - Nearest City Lookup</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="/static/vendor/leaflet.css" />
    <!-- Google Fonts -->
    <link rel="stylesheet" href="/static/vendor/inter/inter.css">
    <!-- Phosphor Icons -->
    <link rel="stylesheet" href="/static/vendor/phosphor/phosphor.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app-container">
        <!-- Sidebar -->
        <aside id="sidebar" class="glass-panel">
            <div class="sidebar-header">
                <i class="ph ph-globe-hemisphere-west"></i>
                <h1>FastCity</h1>
            </div>
            <a href="/docs" class="api-link" target="_blank" rel="noopener noreferrer">
                <i class="ph ph-file-code"></i> API Documentation
            </a>

            
            <div class="control-group">
                <label for="k-input">Number of Cities</label>
                <div class="range-container">
                    <input type="range" id="k-input" min="1" max="50" value="5">
                    <span id="k-value">5</span>
                </div>
            </div>

            <div class="control-group">
                <label for="unit-select">Distance Unit</label>
                <select id="unit-select">
                    <option value="nm" selected>Nautical Miles (nm)</option>
                    <option value="km">Kilometers (km)</option>
                    <option value="mi">Miles (mi)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="map-style-select">Map Style</label>
                <div class="custom-select-wrapper">
                    <div class="custom-select" id="map-style-selected">
                        <span>Loading...</span>
                        <i class="ph ph-caret-down"></i>
                    </div>
                    <div class="custom-options hidden" id="map-style-options">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <div class="instruction">
                <i class="ph ph-hand-tap"></i>
                <p>Click anywhere on the map to find nearby cities.</p>
            </div>
        </aside>

        <!-- Main Map Area -->
        <main id="map-container">
            <div id="map"></div>
            
            <!-- Floating Coordinates Widget -->
            <div id="coordinates-widget" class="glass-panel">
                <i class="ph ph-crosshair"></i>
                <span id="lat-val">0.0000</span>°, <span id="lon-val">0.0000</span>°
            </div>

            <!-- Loading Indicator -->
            <div id="loading" class="glass-panel hidden">
                <i class="ph ph-spinner ph-spin"></i> Searching...
            </div>
        </main>
        
        <!-- Results Table (Collapsible) -->
        <div id="results-panel" class="glass-panel hidden">
            <div class="results-header">
                <h2><i class="ph ph-list-dashes"></i> Nearby Cities</h2>
                <div class="results-actions">
                    <button id="export-csv" class="export-btn" aria-label="Export to CSV" title="Export to CSV"><i class="ph ph-file-csv"></i> CSV</button>
                    <button id="export-json" class="export-btn" aria-label="Export to JSON" title="Export to JSON"><i class="ph ph-file-code"></i> JSON</button>
                    <button id="close-results" aria-label="Close results" title="Close"><i class="ph ph-x"></i></button>
                </div>
            </div>
            <div class="table-container">
                <table id="results-table">
                    <thead>
                        <tr>
                            <th data-sort="name" class="sortable">City <i class="ph ph-caret-up hidden sort-icon"></i></th>
                            <th data-sort="country" class="sortable">Country <i class="ph ph-caret-up hidden sort-icon"></i></th>
                            <th data-sort="population" class="sortable">Population <i class="ph ph-caret-up hidden sort-icon"></i></th>
                            <th data-sort="distance" class="sortable">Distance (<span id="table-unit-label">nm</span>) <i class="ph ph-caret-up hidden sort-icon"></i></th>
                            <th data-sort="heading" class="sortable">Heading <i class="ph ph-caret-up hidden sort-icon"></i></th>
                        </tr>
                    </thead>
                    <tbody id="results-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="/static/vendor/leaflet.js"></script>
    <!-- Custom JS -->
    <script src="/static/app.js"></script>
</body>
</html>
